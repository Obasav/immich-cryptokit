name: Validate ManagedApp iOS Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/managed-ios-mtls-build.yml'

permissions:
  contents: read

jobs:
  build-ios:
    name: Compile iOS without signing
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          flutter --version
          ruby --version
          pod --version

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install OpenAPI generator
        run: npm install --global @openapitools/openapi-generator-cli@2.41.0

      - name: Generate Immich Dart OpenAPI client
        working-directory: open-api
        run: bash ./bin/generate-dart-sdk.sh

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate Immich mobile sources
        working-directory: mobile
        run: |
          dart run drift_dev make-migrations
          dart run build_runner build
          dart run drift_dev schema generate --data-classes --companions drift_schemas/main/ test/drift/main/generated/
          for file in pigeon/*.dart; do
            dart run pigeon --input "$file"
          done
          dart format lib/platform/
          dart run easy_localization:generate -S ../i18n
          dart run bin/generate_keys.dart
          dart format lib/generated/codegen_loader.g.dart lib/generated/translations.g.dart

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install

      - name: Compile Immich for iOS without code signing
        working-directory: mobile
        run: flutter build ios --debug --no-codesign
